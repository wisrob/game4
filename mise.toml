[tools]
node = "24.11.0"

[tasks.setup]
description = "Install locked dependencies and browser for playtests"
run = ["npm ci", "npx playwright install chromium"]

[tasks.assets]
description = "Regenerate GLB models and source blend files with installed Blender"
run = "node scripts/assets.mjs"

[tasks.dev]
description = "Start game and authoritative multiplayer server"
run = "node scripts/dev.mjs"

[tasks.build]
description = "Build the browser client"
run = "npm run build"

[tasks.test]
description = "Run simulation and multiplayer tests"
run = "npm test"

[tasks.playtest]
description = "Launch isolated servers, play in Chromium, save screenshots and metrics"
run = "node scripts/playtest.mjs"

[tasks.check]
description = "Build, test, and run a short browser smoke check"
run = ["npm run build", "npm test", "node scripts/playtest.mjs --smoke"]

[tasks.check-full]
description = "Build, test, and run the complete gameplay and editor playtest"
run = ["npm run build", "npm test", "node scripts/playtest.mjs"]

[tasks.perf]
description = "Summarize the latest manual browser performance log (pass --all for automated logs)"
run = "node scripts/perf-report.mjs"

[tasks.map-generate]
description = "Author the example open world and export deterministic chunks"
run = "node scripts/map-tools.mjs --generate"

[tasks.map-build]
description = "Validate and export world/map.json as streamable chunks"
run = "node scripts/map-tools.mjs"
